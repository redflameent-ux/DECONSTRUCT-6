name: Build DECONSTRUCT-6 (Windows + Mac)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build plugin and standalone app
        shell: pwsh
        run: |
          cmake --build build --config Release --target DC6_VST3 DC6_Standalone --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Make the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\DECONSTRUCT-6.iss

      - name: Zip the plain files too
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\DC6_artefacts\Release\VST3\DECONSTRUCT-6.vst3" dist\
          Copy-Item "build\DC6_artefacts\Release\Standalone\DECONSTRUCT-6.exe" dist\
          Compress-Archive -Path dist\* -DestinationPath DECONSTRUCT-6-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            installer/Output/DECONSTRUCT-6-Setup.exe
            DECONSTRUCT-6-Windows.zip

      - name: Show what went wrong
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in @("configure.log", "build.log")) {
            if (Test-Path $f) {
              Get-Content $f | Select-String -Pattern "error|Error|fatal|not found|Could not" | Select-Object -Last 8 | ForEach-Object {
                $line = $_.Line -replace "%", "%25" -replace "`r", "" -replace "`n", " "
                Write-Output "::error title=$f::$line"
              }
            }
          }

  # ---------------------------------------------------------------------- Mac
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure (Apple Silicon + Intel)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 2>&1 | tee configure.log
          exit ${PIPESTATUS[0]}

      - name: Build AU, VST3 and standalone app
        run: |
          cmake --build build --target DC6_AU DC6_VST3 DC6_Standalone --parallel 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Make the Mac installer (.pkg)
        run: |
          A=build/DC6_artefacts/Release
          ROOT=pkgroot
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/Components" "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Applications"
          cp -R "$A/AU/DECONSTRUCT-6.component" "$ROOT/Library/Audio/Plug-Ins/Components/"
          cp -R "$A/VST3/DECONSTRUCT-6.vst3"     "$ROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R "$A/Standalone/DECONSTRUCT-6.app" "$ROOT/Applications/"
          # ad-hoc signatures so Apple Silicon Macs will load the plugins
          codesign --force --deep -s - "$ROOT/Library/Audio/Plug-Ins/Components/DECONSTRUCT-6.component"
          codesign --force --deep -s - "$ROOT/Library/Audio/Plug-Ins/VST3/DECONSTRUCT-6.vst3"
          codesign --force --deep -s - "$ROOT/Applications/DECONSTRUCT-6.app"
          pkgbuild --root "$ROOT" --identifier com.trance6.deconstruct6 --version 0.1.0 --install-location / DECONSTRUCT-6-Mac.pkg
          (cd "$ROOT/Library/Audio/Plug-Ins" && zip -qry "$GITHUB_WORKSPACE/DECONSTRUCT-6-Mac.zip" "Components/DECONSTRUCT-6.component" "VST3/DECONSTRUCT-6.vst3")

      - name: Check the AU passes Apple's validator
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "pkgroot/Library/Audio/Plug-Ins/Components/DECONSTRUCT-6.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aumf Dc6x Trc6 > auval.log 2>&1 || true
          tail -15 auval.log
          if grep -q "AU VALIDATION SUCCEEDED" auval.log; then
            echo "::notice title=auval::AU VALIDATION SUCCEEDED"
          else
            grep -E "FAIL|ERROR|WARNING" auval.log | tail -8 | while read -r l; do echo "::error title=auval::${l//%/%25}"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            DECONSTRUCT-6-Mac.pkg
            DECONSTRUCT-6-Mac.zip

      - name: Show what went wrong
        if: failure()
        run: |
          for f in configure.log build.log; do
            [ -f "$f" ] && grep -E "error|Error|fatal|not found" "$f" | tail -8 | while read -r l; do echo "::error title=$f::${l//%/%25}"; done
          done; true

  # ------------------------------------------------------------------ Release
  release:
    needs: [ windows, mac ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Remove the previous "latest" build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag -y --repo "${{ github.repository }}" || true

      - name: Publish to the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: DECONSTRUCT-6 - latest build
          body: |
            **Windows:** download **DECONSTRUCT-6-Setup.exe**, double-click it, then rescan plugins in your DAW.
            **Mac (AU + VST3):** download **DECONSTRUCT-6-Mac.pkg**, right-click it and choose **Open** (it isn't signed with an Apple developer certificate yet), then rescan plugins.
            The .zip files hold the same plugins if you'd rather copy them by hand.
          prerelease: false
          make_latest: true
          files: |
            out/**/DECONSTRUCT-6-Setup.exe
            out/**/DECONSTRUCT-6-Windows.zip
            out/**/DECONSTRUCT-6-Mac.pkg
            out/**/DECONSTRUCT-6-Mac.zip
          fail_on_unmatched_files: true
